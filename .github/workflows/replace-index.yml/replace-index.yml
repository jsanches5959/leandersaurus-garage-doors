name: Replace index with redesign
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with redesigned file
        run: |
          mv dino-garage-doors.html index.html
          rm -f .github/workflows/replace-index.yml
          git config user.name "jsanches5959"
          git config user.email "hello@joefsanches.com"
          git add -A
          git commit -m "Redesign: badge palette, Jobber form, footprint video, Joe Sanches LLC footer"
          git push

